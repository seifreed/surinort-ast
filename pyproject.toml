[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "surinort-ast"
version = "3.0.3"
description = "Production-grade Abstract Syntax Tree parser for IDS rules (Suricata/Snort) with comprehensive validation and serialization support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Marc Rivero López", email = "mriverolopez@gmail.com" }
]
maintainers = [
    { name = "Marc Rivero López", email = "mriverolopez@gmail.com" }
]
keywords = [
    "ids",
    "ips",
    "parser",
    "ast",
    "suricata",
    "snort",
    "security",
    "cybersecurity",
    "network-security",
    "intrusion-detection",
    "rule-parser",
    "signature-analysis",
    "threat-detection",
    "pcap",
    "network-monitoring",
    "malware-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
    "Natural Language :: English",
]

# Production dependencies — a plain `pip install surinort-ast` installs the full
# feature set (serialization, rich CLI, analysis, extra formats). No extras needed.
dependencies = [
    "lark>=1.3.1",           # Modern parser with Earley/LALR support
    "pydantic>=2.13.4",      # Data validation with type hints (includes JSON serialization)
    "typer>=0.27.0",         # Modern CLI framework with type hints
    "jsonschema>=4.26.0",    # JSON Schema validation
    "rich>=15.0.0",          # Rich terminal output for the CLI
    "msgpack>=1.1.2",        # Binary serialization (faster than JSON)
    "protobuf>=7.35.0",      # Protocol Buffers serialization (matches ast_pb2 gencode)
    "networkx>=3.6.1",       # Graph analysis for rule relationships
    "pyyaml>=6.0.3",         # YAML serialization support
    "python-magic>=0.4.27",  # File type detection
]

[project.optional-dependencies]
# Development & CI tooling — everything needed to build, test, lint, type-check,
# and audit the project. Installed via `pip install -e .[dev]`.
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=5.2.3",
    "hypothesis>=6.164.0",
    # Linting, formatting, typing
    "ruff>=0.16.1",
    "black>=26.1.0",
    "mypy>=2.3.0",
    # Security & dependency auditing
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    # Build, publishing, hooks, docs
    "build>=1.5.0",
    "twine>=7.0.0",
    "pre-commit>=4.6.1",
    "mkdocs-material>=9.7.7",
]

[project.urls]
Homepage = "https://github.com/seifreed/surinort-ast"
Documentation = "https://seifreed.github.io/surinort-ast"
Repository = "https://github.com/seifreed/surinort-ast"
Issues = "https://github.com/seifreed/surinort-ast/issues"
Changelog = "https://github.com/seifreed/surinort-ast/blob/main/CHANGELOG.md"
Source = "https://github.com/seifreed/surinort-ast"
"Bug Tracker" = "https://github.com/seifreed/surinort-ast/issues"
"Release Notes" = "https://github.com/seifreed/surinort-ast/releases"
Discussions = "https://github.com/seifreed/surinort-ast/discussions"

[project.scripts]
surinort = "surinort_ast.cli:app"

# Plugin entry points for extensibility
# Third-party plugins can register themselves here
[project.entry-points."surinort_ast.plugins"]
# Example entry points (commented out - enable when plugins are ready):
# yaml_serializer = "surinort_yaml:YAMLSerializerPlugin"
# toml_serializer = "surinort_toml:TOMLSerializerPlugin"
# security_auditor = "surinort_security:SecurityAuditorPlugin"

[tool.black]
line-length = 100
target-version = ["py311"]

# Ruff configuration (replaces flake8, black, isort)
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    "benchmarks",
    "examples",
    "check_circular_deps.py",
]

[tool.ruff.lint]
# Enable common linting rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "UP042",  # Keep explicit str + Enum pattern until a dedicated StrEnum refactor
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "PLC0415", "PTH123", "PLW2901"]  # Allow test-specific patterns

# Singledispatch pattern requires unused arguments for dispatch registration
"src/surinort_ast/printer/text_printer.py" = [
    "ARG001",  # Unused function argument (singledispatch pattern requirement)
    "PLR0911", # Too many returns (inherent to printer dispatch logic)
]
"src/surinort_ast/parsing/lark_parser.py" = [
    "ARG001",  # Unused arguments (Lark transformer interface compliance)
    "ARG002",  # Unused arguments (Lark transformer interface compliance)
]
"src/surinort_ast/parsing/mixins/content_transformer.py" = [
    "ARG002",  # Unused arguments (transformer mixin interface compliance)
    "F841",    # Fast-path scratch variables are occasionally left in parser hot paths
]
"src/surinort_ast/parsing/mixins/__init__.py" = [
    "E402",    # Protocol declaration intentionally precedes mixin re-exports
]
"src/surinort_ast/parsing/mixins/options/generic_mixin.py" = [
    "ARG002",  # Unused arguments (mixin interface compliance)
]
"src/surinort_ast/query/parser.py" = [
    "ARG002",  # Unused arguments (parser interface compliance)
]
"src/surinort_ast/query/selectors.py" = [
    "ARG002",  # Unused arguments (selector interface compliance)
    "PLR0911", # Too many returns (inherent to selector matching logic)
    "PLR0912", # Too many branches (inherent to selector matching logic)
]
"src/surinort_ast/query/executor.py" = [
    "ARG002",  # Unused arguments (executor interface compliance)
    "PLR0911", # Too many returns (inherent to query execution)
]
"src/surinort_ast/serialization/protobuf/serializer.py" = [
    "ARG001",  # Unused arguments (serializer interface compliance)
    "PLR0911", # Too many returns (inherent to serialization logic)
]
"src/surinort_ast/streaming/processor.py" = [
    "PLC0415", # Lazy import avoids validation-layer import cycles
]
"src/surinort_ast/serialization/json_serializer.py" = [
    "PLC0207", # Version parsing favors readability over split micro-optimization
]

# Import outside top-level to avoid circular dependencies (by design)
"src/surinort_ast/streaming/parser.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/plugins/loader.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/plugins/registry.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/analysis/*.py" = [
    "PLC0415",  # Lazy imports to avoid circular dependencies
]
"src/surinort_ast/query/*.py" = [
    "PLC0415",  # Lazy imports for optional dependencies and circular imports
]
"src/surinort_ast/builder/option_builders.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/parsing/factory.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/parsing/transformer.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/parsing/mixins/options/metadata_mixin.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/cli/shared.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/cli/commands/*.py" = [
    "PLC0415",  # Import inside function (avoids circular imports and optional deps)
]

# Complex logic inherent to parsing/validation/CLI
"src/surinort_ast/api/parsing.py" = [
    "PLC0415",  # Import inside function (avoids circular imports)
]
"src/surinort_ast/builder/rule_builder.py" = [
    "F401",    # Builder re-exports share import blocks with optional builder helpers
    "PLR0911",  # Too many returns (inherent to builder pattern)
]
"src/surinort_ast/core/nodes.py" = [
    "UP007",    # Runtime type aliases need Union syntax for Pydantic
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Pydantic plugin for mypy
plugins = ["pydantic.mypy"]

# Tests are type-checked, but at a pragmatic strictness: test functions and
# fixtures need not be fully annotated, and untyped helper/fixture calls are
# allowed. Genuine value-type checks (arg-type, attr-defined, return-value,
# union-attr, …) stay on so deliberate-violation tests remain meaningful.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
# Tests read/operate on the discriminated-union AST types directly
# (rule.options[i].value, header.src_addr.elements, "x" in opt.value, passing
# ASTNode | None to selectors). mypy cannot narrow those unions at the use
# site; src already treats the same pattern as a false positive. Disabling
# these union/access codes here mirrors that, leaving genuine errors
# (var-annotated, call-arg, override, …) enforced.
disable_error_code = [
    "union-attr",
    "attr-defined",
    "index",
    "arg-type",
    "list-item",
    "operator",
]

# Protobuf generated code lacks type annotations (unfixable without regeneration)
[[tool.mypy.overrides]]
module = "surinort_ast.serialization.protobuf.ast_pb2"
disable_error_code = [
    "no-untyped-call",
    "attr-defined",
    "no-any-return",
    "unused-ignore",
    "import-untyped",
]

[[tool.mypy.overrides]]
module = "surinort_ast.serialization.protobuf.serializer"
disable_error_code = ["attr-defined", "no-any-return", "unused-ignore", "import-untyped"]

# Streaming parser: arg-type false positive on discriminated-union tuple append
[[tool.mypy.overrides]]
module = "surinort_ast.streaming.parser"
disable_error_code = ["arg-type"]

# Query executor: union-attr false positives with selector type narrowing
[[tool.mypy.overrides]]
module = "surinort_ast.query.executor"
disable_error_code = ["union-attr"]

# LSH: hashing helper returns Any from the stdlib
[[tool.mypy.overrides]]
module = "surinort_ast.analysis.lsh"
disable_error_code = ["no-any-return"]

# Plugin loader: list-of-union vs base-plugin return covariance
[[tool.mypy.overrides]]
module = "surinort_ast.plugins.loader"
disable_error_code = ["return-value"]

# Analysis strategies: union compatibility with base Option type
[[tool.mypy.overrides]]
module = "surinort_ast.analysis.strategies"
disable_error_code = ["arg-type"]

# CLI shared: untyped callback decorators
[[tool.mypy.overrides]]
module = "surinort_ast.cli.shared"
disable_error_code = ["no-untyped-def"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=surinort_ast",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "golden: marks tests that use real-world rule files (35k+ rules)",
]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["surinort_ast"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*_pb2.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "^\\s*\\.\\.\\.$",
]

# Hatchling configuration
[tool.hatch.build.targets.wheel]
packages = ["src/surinort_ast"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/requirements.txt",
]
exclude = [
    "/.git",
    "/.github",
    "/.vscode",
    "/.idea",
    "/dist",
    "/build",
    "/__pycache__",
    "/*.egg-info",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/htmlcov",
    "/.coverage",
    "/venv",
    "/env",
]

# Bandit security configuration
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "venv", ".venv", "env", "benchmarks", "examples"]
