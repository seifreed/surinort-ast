version: 2

multi-ecosystem-groups:
  python-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - python
  github-actions:
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - github-actions

updates:
  - package-ecosystem: uv
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: python-dependencies

  - package-ecosystem: pip
    directory: "/"
    patterns: ["*"]
    exclude-paths:
      - pyproject.toml
      - uv.lock
    versioning-strategy: increase
    multi-ecosystem-group: python-dependencies

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: github-actions
