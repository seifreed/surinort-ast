# Documentation Build and Deployment Pipeline
# Deploys MkDocs Material documentation to GitHub Pages

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.yaml'
  workflow_dispatch:

# Security: Restrict default permissions to read-only
permissions:
  contents: read

# Cancel in-progress documentation builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build documentation
  build:
    name: Build Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for git-revision-date-localized plugin

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.0.1
          python -m pip install mkdocs-material==9.7.6

      - name: Resolve MkDocs configuration
        id: mkdocs-config
        run: |
          if [ -f "mkdocs.yml" ]; then
            echo "file=mkdocs.yml" >> "$GITHUB_OUTPUT"
          elif [ -f "mkdocs.yaml" ]; then
            echo "file=mkdocs.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build documentation
        if: ${{ steps.mkdocs-config.outputs.file != '' }}
        run: |
          mkdocs build --strict --verbose --config-file "${{ steps.mkdocs-config.outputs.file }}"

      - name: Verify documentation build
        if: ${{ steps.mkdocs-config.outputs.file != '' }}
        run: |
          if [ ! -d "site" ]; then
            echo "site directory was not created"
            exit 1
          fi
          ls -lh site/
          du -sh site/
        shell: bash

      - name: Upload documentation artifacts
        if: ${{ steps.mkdocs-config.outputs.file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation
          path: site/
          retention-days: 7

  # Deploy to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # Required to push to gh-pages branch
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.0.1
          python -m pip install mkdocs-material==9.7.6

      - name: Resolve MkDocs configuration
        id: mkdocs-config
        run: |
          if [ -f "mkdocs.yml" ]; then
            echo "file=mkdocs.yml" >> "$GITHUB_OUTPUT"
          elif [ -f "mkdocs.yaml" ]; then
            echo "file=mkdocs.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: ${{ steps.mkdocs-config.outputs.file != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.mkdocs-config.outputs.file != '' }}
        run: |
          mkdocs gh-deploy --config-file "${{ steps.mkdocs-config.outputs.file }}" --force --message "Deploy documentation from {sha}"

  # Documentation link checker
  link-check:
    name: Check Documentation Links
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download documentation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: documentation
          path: site/
        continue-on-error: true

      - name: Check for documentation artifacts
        id: docs-artifacts
        run: |
          if [ -d site ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check links
        if: ${{ steps.docs-artifacts.outputs.available == 'true' }}
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.2.0
        with:
          args: '--verbose --no-progress --exclude-mail ./site'
          fail: false  # Don't fail on broken links, just report

  # Documentation success summary
  docs-success:
    name: Documentation Pipeline Success
    needs: [build, deploy, link-check]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
            echo "Documentation build failed"
            exit 1
          fi
          if [[ "${{ needs.deploy.result }}" != "success" && "${{ needs.deploy.result }}" != "skipped" ]]; then
            echo "Documentation deployment failed"
            exit 1
          fi
          if [[ "${{ needs.link-check.result }}" != "success" && "${{ needs.link-check.result }}" != "skipped" ]]; then
            echo "Documentation link check failed"
            exit 1
          fi
          echo "Documentation deployed successfully!"
          echo "Visit: https://seifreed.github.io/surinort-ast/"
