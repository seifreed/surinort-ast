# Documentation Build and Deployment Pipeline
# Deploys MkDocs Material documentation to GitHub Pages

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'conformance/**'
      - 'tools/conformance_lab.py'
      - 'tools/conformance_dashboard.py'
      - 'mkdocs.yml'
      - 'mkdocs.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'conformance/**'
      - 'tools/conformance_lab.py'
      - 'tools/conformance_dashboard.py'
      - 'mkdocs.yml'
      - 'mkdocs.yaml'
  workflow_dispatch:

# Security: Restrict default permissions to read-only
permissions:
  contents: read

# Cancel in-progress documentation builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build documentation
  build:
    name: Build Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for git-revision-date-localized plugin

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.0.1
          python -m pip install mkdocs-material==9.7.6

      - name: Resolve MkDocs configuration
        id: mkdocs-config
        run: |
          if [ -f "mkdocs.yml" ]; then
            echo "file=mkdocs.yml" >> "$GITHUB_OUTPUT"
          elif [ -f "mkdocs.yaml" ]; then
            echo "file=mkdocs.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate conformance dashboard snapshot
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p conformance/history
          python -m pip install -e .
          snapshot="conformance/history/bundled-${GITHUB_SHA}.json"
          python tools/conformance_lab.py \
            --manifest conformance/manifest.bundled.json \
            --summary-only \
            --output "$snapshot"
          python -m tools.conformance_dashboard \
            --history-dir conformance/history \
            --output docs/conformance-dashboard.md

      - name: Require MkDocs configuration
        if: ${{ steps.mkdocs-config.outputs.file == '' }}
        run: |
          echo "mkdocs.yml or mkdocs.yaml is required"
          exit 1

      - name: Build documentation
        run: |
          mkdocs build --strict --verbose --config-file "${{ steps.mkdocs-config.outputs.file }}"

      - name: Verify documentation build
        run: |
          if [ ! -d "site" ]; then
            echo "site directory was not created"
            exit 1
          fi
          ls -lh site/
          du -sh site/
        shell: bash

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation
          path: site/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  # Deploy to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  # Documentation link checker
  link-check:
    name: Check Documentation Links
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download documentation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: documentation
          path: site/
        continue-on-error: true

      - name: Check for documentation artifacts
        id: docs-artifacts
        run: |
          if [ -d site ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check links
        if: ${{ steps.docs-artifacts.outputs.available == 'true' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.2.0
        with:
          args: '--verbose --no-progress --exclude-mail ./site'
          fail: false  # Don't fail on broken links, just report

  # Documentation success summary
  docs-success:
    name: Documentation Pipeline Success
    needs: [build, deploy, link-check]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
            echo "Documentation build failed"
            exit 1
          fi
          if [[ "${{ needs.deploy.result }}" != "success" && "${{ needs.deploy.result }}" != "skipped" ]]; then
            echo "Documentation deployment failed"
            exit 1
          fi
          if [[ "${{ needs.link-check.result }}" != "success" && "${{ needs.link-check.result }}" != "skipped" ]]; then
            echo "Documentation link check failed"
            exit 1
          fi
          echo "Documentation deployed successfully!"
          echo "Visit: https://seifreed.github.io/surinort-ast/"
