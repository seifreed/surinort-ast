name: Surinort AST
description: Validate Suricata and Snort rule files and optionally verify them with an IDS engine.
author: seifreed
inputs:
  rules:
    description: Rule file or recursive glob of rule files to validate.
    required: true
  dialect:
    description: Rule dialect (suricata, snort2, or snort3).
    required: false
    default: suricata
  engine:
    description: Engine name for capability validation.
    required: false
    default: ''
  engine-version:
    description: Versioned engine target, for example 8.x or 3.x.
    required: false
    default: ''
  sarif:
    description: Write a SARIF report for upload to code scanning.
    required: false
    default: 'true'
  sarif-file:
    description: Path for the SARIF report.
    required: false
    default: surinort-results.sarif
  baseline:
    description: Optional SARIF baseline; existing findings do not fail validation.
    required: false
    default: ''
  engine-command:
    description: Optional command template containing {file} for engine validation.
    required: false
    default: ''
  engine-verify:
    description: Run the configured engine command against the rule file.
    required: false
    default: 'false'
outputs:
  sarif-file:
    description: Path to the generated SARIF report, when enabled.
    value: ${{ steps.validate.outputs.sarif-file }}
runs:
  using: composite
  steps:
    - name: Install Surinort AST
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Validate rules
      id: validate
      shell: bash
      env:
        RULES: ${{ inputs.rules }}
        DIALECT: ${{ inputs.dialect }}
        ENGINE: ${{ inputs.engine }}
        ENGINE_VERSION: ${{ inputs.engine-version }}
        SARIF: ${{ inputs.sarif }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        mapfile -t rule_files < <(python - "$RULES" <<'PY'
        import glob
        import sys
        from pathlib import Path

        pattern = sys.argv[1]
        matches = sorted(glob.glob(pattern, recursive=True))
        if not matches and Path(pattern).is_file():
            matches = [pattern]
        for match in matches:
            if Path(match).is_file():
                print(match)
        PY
        )
        if [[ "${#rule_files[@]}" -eq 0 ]]; then
          echo "No rule files matched: $RULES" >&2
          exit 1
        fi
        args=("${rule_files[@]}" --dialect "$DIALECT")
        if [[ -n "$ENGINE" || -n "$ENGINE_VERSION" ]]; then
          if [[ -z "$ENGINE" || -z "$ENGINE_VERSION" ]]; then
            echo "engine and engine-version must be provided together" >&2
            exit 1
          fi
          args+=(--engine "$ENGINE" --engine-version "$ENGINE_VERSION")
        fi
        if [[ "$SARIF" == "true" ]]; then
          set +e
          python -m surinort_ast.cli.main validate "${args[@]}" --format sarif --output "$SARIF_FILE"
          validation_status=$?
          set -e
          echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
          if [[ -n "$BASELINE" ]]; then
            if [[ ! -f "$BASELINE" ]]; then
              echo "Baseline SARIF file not found: $BASELINE" >&2
              exit 1
            fi
            set +e
            python "$GITHUB_ACTION_PATH/tools/sarif_baseline.py" "$SARIF_FILE" "$BASELINE"
            validation_status=$?
            set -e
          fi
          exit "$validation_status"
        else
          python -m surinort_ast.cli.main validate "${args[@]}"
        fi
    - name: Verify with IDS engine
      if: ${{ inputs.engine-verify == 'true' }}
      shell: bash
      env:
        RULES: ${{ inputs.rules }}
        ENGINE_COMMAND: ${{ inputs.engine-command }}
      run: |
        if [[ -z "$ENGINE_COMMAND" ]]; then
          echo "engine-command is required when engine-verify is true" >&2
          exit 1
        fi
        python - "$RULES" "$ENGINE_COMMAND" <<'PY'
        import glob
        import os
        import sys
        from pathlib import Path
        from surinort_ast.analysis import EngineVerifier

        pattern, command = sys.argv[1:]
        files = sorted(glob.glob(pattern, recursive=True)) or [pattern]
        results = [
            EngineVerifier(command).verify(Path(filename))
            for filename in files
            if Path(filename).is_file()
        ]
        for result in results:
            print(f"Engine verification: {result.status}")
        raise SystemExit(0 if results and all(result.passed for result in results) else 1)
        PY
